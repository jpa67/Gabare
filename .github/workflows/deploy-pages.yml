# (Gabare) The site, from the branch gabare: the install page, the pages, the packages, and the web emulator built from
# Gabare's code at the version of the newest package that install/SHA256SUMS names.
name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - gabare
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # (Gabare) GitHub publishes no site from a private repository on a free account: the job waits for a public one.
    if: github.ref == 'refs/heads/gabare' && !github.event.repository.private
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read          # (Gabare) the checkout (the job's permissions replace the workflow's)
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the web emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3
          APP_VER=$(sed -n 's/^[0-9a-f]\{64\} [ *]\?gabare-\([0-9.]*\)\.fwsc$/\1/p' install/SHA256SUMS | sort -V | tail -1)
          test -n "$APP_VER"
          APP_VER="$APP_VER" source/web/make_emulator.sh
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
